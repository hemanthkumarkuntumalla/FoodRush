function compressUploadedImage(file, maxW=700, maxH=700, quality=.72){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Could not read the image.'));
    reader.onload=e=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Could not decode the image.'));
      img.onload=()=>{
        const scale=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight);
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
        canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function clearImageChoice(prefix, keep){
  const upload=document.getElementById(prefix+'Upload');

}

function imageUrl(image, imagePath){
  if(imagePath && String(imagePath).trim()) return String(imagePath).trim();
  if(!image)return '';
  const value=String(image).trim();
  if(value.startsWith('data:image/')) return value;
  if(/^https?:\/\//i.test(value)) return value;
  // Treat project-relative/local image paths as real paths, not Unsplash IDs.
  if(/^(?:\.?\/?assets\/|\/|[^:]+\.(?:jpe?g|png|webp|gif|svg)(?:\?.*)?$)/i.test(value)) return value;
  return 'https://images.unsplash.com/photo-'+value+'?auto=format&fit=crop&w=400&q=80';
}
function openCategoryEditor(i){
  const editing=i>=0, c=editing?cats[i]:{name:'',image:'',imagePath:''};
  document.getElementById('modalTitle').textContent=editing?'Edit Category':'Add Category';
  document.getElementById('editorFields').innerHTML=`
    <div class="row g-3">
      <div class="col-12"><label class="form-label">Category name</label><input id="editCatName" class="form-control" value="${esc(c.name)}" placeholder="e.g. Pizza"></div>
      <div class="col-12">
        <label class="form-label">Insert category picture</label>
        <input id="editCatUpload" type="file" accept="image/*" class="form-control" onchange="previewCategoryUpload(this)">
        <div class="form-text">Choose JPG, PNG or WebP. The selected picture is compressed and stored in this browser so it remains after refresh. Choosing this option clears URL and Path.</div>
      </div>
      <div class="col-12"><label class="form-label">Image URL or Unsplash photo ID</label><input id="editCatImage" class="form-control" value="${esc((c.image||'').startsWith('data:image/')?'':(c.image||''))}" placeholder="https://... or Unsplash photo ID" oninput="previewCategoryField('image')"></div>
      <div class="col-12"><label class="form-label">Image Path</label><input id="editCatImagePath" class="form-control" value="${esc(c.imagePath||'')}" placeholder="assets/images/categories/pizza.jpg" oninput="previewCategoryField('path')"><div class="form-text">Use this only if you are NOT using picture upload or Image URL. Choosing it clears the other two options.</div></div>
      <div class="col-12"><label class="form-label">Picture preview</label><img id="editCatPreview" src="${esc(imageUrl(c.image,c.imagePath))}" style="width:180px;height:120px;object-fit:cover;border-radius:14px;${(c.image||c.imagePath)?'':'display:none'}" onerror="this.style.display='none'"></div>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-4"><button class="btn btn-secondary" onclick="closeEditor()">Cancel</button><button class="btn btn-brand" onclick="saveCategory(${i})">${editing?'Save Changes':'Add Category'}</button></div>`;
  const existingCatUpload=(c.image||'').startsWith('data:image/');
  if(existingCatUpload){const p=document.getElementById('editCatPreview');p.src=c.image;p.style.display='block';p.dataset.uploadData=c.image;}
  editModal.style.display='flex';document.body.classList.add('fr-modal-open');
}
function previewCategoryUpload(input){
  const file=input.files&&input.files[0]; if(!file)return;
  if(!file.type.startsWith('image/')) return alert('Please select an image file.');
  compressUploadedImage(file).then(data=>{
    clearImageChoice('editCat','upload');
    const p=document.getElementById('editCatPreview');
    p.src=data;p.style.display='block';p.dataset.uploadData=data;
  }).catch(()=>alert('Could not process this picture.'));
}
function previewCategoryField(changed){
  const p=document.getElementById('editCatPreview'); if(!p)return;
  p.dataset.uploadData='';
  clearImageChoice('editCat',changed||'');
  const path=(document.getElementById('editCatImagePath')?.value||'').trim();
  const image=(document.getElementById('editCatImage')?.value||'').trim();
  const src=changed==='path' ? path : (changed==='image' ? (image ? imageUrl(image,'') : '') : (path || (image ? imageUrl(image,'') : '')));
  if(src){p.src=src;p.style.display='block';} else {p.removeAttribute('src');p.style.display='none';}
}
function saveCategory(i){
  const name=editCatName.value.trim();
  if(!name)return alert('Enter a category name.');
  if(cats.some((c,idx)=>idx!==i && c.name.toLowerCase()===name.toLowerCase()))return alert('Category already exists.');
  const p=document.getElementById('editCatPreview');
  const uploadData=p?.dataset.uploadData||'';
  const imageField=editCatImage.value.trim();
  const pathField=editCatImagePath.value.trim();
  const item={name,image:uploadData || imageField,imagePath:uploadData || imageField ? '' : pathField};
  if(i>=0){const old=cats[i].name;cats[i]=item;foods.forEach(f=>{if(f.cat===old)f.cat=name;});}
  else cats.push(item);
  if(save()){closeEditor();render();}
}
function delCat(i){
  if(!confirm('Delete this category? Foods using it will remain, but their category will no longer be available.'))return;
  cats.splice(i,1);save();render();
}

function openFoodEditor(i){

      <div class="col-md-6"><label class="form-label">Category</label><select id="efCat" class="form-select">${cats.map(c=>`<option value="${esc(c.name)}" ${c.name===f.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>

        <input id="efUpload" type="file" accept="image/*" class="form-control" onchange="previewFoodUpload(this)">

      </div>
      <div class="col-12">
        <label class="form-label">Image URL or Unsplash photo ID</label>
        <input id="efImage" class="form-control" value="${esc((f.image||'').startsWith('data:image/')?'':(f.image||''))}" placeholder="https://... or Unsplash photo ID" oninput="previewFoodField('image')">

      </div>
      <div class="col-12">
        <label class="form-label">Picture preview</label>
        <img id="efPreview" src="${esc(imageUrl(f.image,f.imagePath))}" style="width:220px;height:140px;object-fit:cover;border-radius:14px;${(f.image||f.imagePath)?'':'display:none'}" onerror="this.style.display='none'">

function previewFoodField(changed){

  const path=(document.getElementById('efImagePath')?.value||'').trim();
  const image=(document.getElementById('efImage')?.value||'').trim();

function saveFood(i){
  const name=efName.value.trim(),price=Number(efPrice.value);
  if(!name||!price)return alert('Food name and price are required.');
  const p=document.getElementById('efPreview');
  const uploadData=p?.dataset.uploadData||'';
  const imageField=efImage.value.trim();
  const pathField=efImagePath.value.trim();
  const restaurant=efRestaurant.value.trim();
  const item={
    id:i>=0?(foods[i].id||Date.now()):Date.now(),
    name,price,cat:efCat.value,restaurant:restaurant||'FoodRush Kitchen',
    rating:efRating.value||'4.5',discount:Number(efDiscount.value)||0,
    image:uploadData || imageField,
    imagePath:uploadData || imageField ? '' : pathField,
    description:efDesc.value.trim()
  };
  if(i>=0)foods[i]=item;else foods.unshift(item);
  if(save()){closeEditor();render();}
}
function delFood(i){
  if(!confirm('Delete this food item?'))return;
  foods.splice(i,1);save();render();
}
function closeEditor(){editModal.style.display='none';document.body.classList.remove('fr-modal-open');}
if(localStorage.getItem('fr_admin')==='true'){login.hidden=true;render();}
</script>

<script>

/* FoodRush premium motion engine */
(function(){
  const ready = () => {
    document.body.classList.add('fr-ready');

    const header = document.querySelector('.navbar-wrap');
    if(header){
      const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 16);
      onScroll();
      window.addEventListener('scroll', onScroll, {passive:true});

      const path = location.pathname.split('/').pop() || 'index.html';
      header.querySelectorAll('.nav-link').forEach(link => {
        const href = (link.getAttribute('href') || '').split('?')[0].split('#')[0];
        if(href === path || (path === '' && href === 'index.html')){
          link.classList.add('active');
          link.setAttribute('aria-current','page');
        }
      });
    }

    const targets = document.querySelectorAll(
      'main > section, main .section, main .card, main .category-card, main .restaurant-card, main .food-card, main .glass, main .offer-banner, footer'
    );
    targets.forEach((el, i) => {
      if(el.closest('.modal-shell')) return;
      el.classList.add(i % 3 === 0 ? 'reveal' : 'reveal-scale');
      el.style.transitionDelay = Math.min((i % 6) * 55, 275) + 'ms';
    });

    if('IntersectionObserver' in window){
      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if(entry.isIntersecting){
            entry.target.classList.add('is-visible');
            obs.unobserve(entry.target);
          }
        });
      }, {threshold:.10, rootMargin:'0px 0px -45px'});
      document.querySelectorAll('.reveal,.reveal-scale').forEach(el => observer.observe(el));
    }else{
      document.querySelectorAll('.reveal,.reveal-scale').forEach(el => el.classList.add('is-visible'));
    }

    document.querySelectorAll('.btn-brand,.btn:not(.navbar-toggler)').forEach(btn => {
      if(btn.dataset.rippleBound) return;
      btn.dataset.rippleBound = '1';
      btn.addEventListener('click', function(e){
        if(this.disabled) return;
        const rect = this.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.className = 'fr-ripple';
        const size = Math.max(rect.width, rect.height) * .32;
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 650);
      });
    });

    // Gentle tilt for desktop food/restaurant cards.
    if(window.matchMedia('(pointer:fine)').matches && !window.matchMedia('(prefers-reduced-motion:reduce)').matches){
      document.querySelectorAll('.food-card,.restaurant-card,.category-card').forEach(card => {
        card.addEventListener('mousemove', e => {
          const r = card.getBoundingClientRect();
          const x = (e.clientX-r.left)/r.width-.5;
          const y = (e.clientY-r.top)/r.height-.5;
          card.style.transform = `translateY(-7px) perspective(700px) rotateX(${(-y*2).toFixed(2)}deg) rotateY(${(x*2).toFixed(2)}deg)`;
        });
        card.addEventListener('mouseleave', () => card.style.transform = '');
      });
    }
  };

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready);
  else ready();
})();

</script>
