<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoodRush - Login & Register</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:30px 15px}
.auth-card{width:min(500px,100%);border-radius:28px;padding:30px}
.auth-tabs{display:flex;gap:8px;background:rgba(127,127,127,.12);padding:6px;border-radius:14px;margin-bottom:24px}
.auth-tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:11px;font-weight:600}
.auth-tabs button.active{background:var(--bs-body-bg,#fff);box-shadow:0 5px 18px rgba(0,0,0,.08)}
.password-wrap{position:relative}.password-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="glass auth-card">
    <div class="text-center mb-4">
      <a href="index.html" class="text-decoration-none"><h2 class="fw-bold mb-1">🍴 FoodRush</h2></a>
      <p class="muted mb-0">Delicious food, delivered fast.</p>
    </div>

    <div class="auth-tabs">
      <button id="loginTab" class="active" onclick="showForm('login')">Login</button>
      <button id="registerTab" onclick="showForm('register')">Register</button>
    </div>

    <div id="message"></div>

    <form id="loginForm" onsubmit="loginUser(event)">
      <label class="form-label">Email</label>
      <input id="loginEmail" type="email" class="form-control mb-3" required placeholder="you@example.com">
      <label class="form-label">Password</label>
      <div class="password-wrap mb-3">
        <input id="loginPassword" type="password" class="form-control" required placeholder="Your password">
        <button type="button" onclick="togglePassword('loginPassword',this)">👁</button>
      </div>
      <button class="btn btn-brand w-100 py-2">Login</button>
      <p class="text-center mt-3 mb-0">Don't have an account? <a href="#" onclick="showForm('register');return false">Create one</a></p>
    </form>

    <form id="registerForm" hidden onsubmit="registerUser(event)">
      <label class="form-label">Full Name</label>
      <input id="regName" class="form-control mb-3" required minlength="2" placeholder="Your full name">
      <label class="form-label">Email</label>
      <input id="regEmail" type="email" class="form-control mb-3" required placeholder="you@example.com">
      <label class="form-label">Mobile Number</label>
      <input id="regMobile" type="tel" class="form-control mb-3" required pattern="[0-9]{10}" placeholder="10-digit mobile number">
      <label class="form-label">Password</label>
      <div class="password-wrap mb-3">
        <input id="regPassword" type="password" class="form-control" required minlength="6" placeholder="Minimum 6 characters">
        <button type="button" onclick="togglePassword('regPassword',this)">👁</button>
      </div>
      <label class="form-label">Confirm Password</label>
      <input id="regConfirm" type="password" class="form-control mb-3" required placeholder="Confirm password">
      <button class="btn btn-brand w-100 py-2">Create Account</button>
      <p class="text-center mt-3 mb-0">Already have an account? <a href="#" onclick="showForm('login');return false">Login</a></p>
    </form>

    <div class="text-center mt-4"><a href="index.html">← Back to FoodRush</a></div>
  </div>
</div>

<script>
function foodrushLogout(){
  localStorage.removeItem('fr_user');
  localStorage.removeItem('fr_cart');
  localStorage.removeItem('fr_checkout_user');
  window.location.href='auth.html';
}

function getUsers(){return JSON.parse(localStorage.getItem('fr_users')||'[]');}
function setUsers(u){localStorage.setItem('fr_users',JSON.stringify(u));}
function showForm(type){
  const login=type==='login';
  loginForm.hidden=!login; registerForm.hidden=login;
  loginTab.classList.toggle('active',login); registerTab.classList.toggle('active',!login);
  message.innerHTML='';
}
function notice(text,type='success'){
  message.innerHTML=`<div class="alert alert-${type}" role="alert">${text}</div>`;
}
function togglePassword(id,btn){
  const input=document.getElementById(id);
  input.type=input.type==='password'?'text':'password';
  btn.textContent=input.type==='password'?'👁':'🙈';
}
function registerUser(e){
  e.preventDefault();
  const name=regName.value.trim(), email=regEmail.value.trim().toLowerCase();
  const mobile=regMobile.value.trim(), password=regPassword.value, confirm=regConfirm.value;
  if(password!==confirm)return notice('Passwords do not match.','danger');
  const users=getUsers();
  if(users.some(u=>u.email===email))return notice('An account with this email already exists. Please login.','danger');
  users.push({id:Date.now(),name,email,mobile,password});
  setUsers(users);
  localStorage.setItem('fr_user',JSON.stringify({id:users.at(-1).id,name,email,mobile}));
  notice('Registration successful! Redirecting to FoodRush...','success');
  setTimeout(()=>location.href='index.html',600);
}
function loginUser(e){
  e.preventDefault();
  const email=loginEmail.value.trim().toLowerCase(), password=loginPassword.value;
  const users=getUsers();
  const user=users.find(u=>u.email===email && u.password===password);
  if(!user)return notice('Invalid email or password. Please register first.','danger');
  localStorage.setItem('fr_user',JSON.stringify({id:user.id,name:user.name,email:user.email,mobile:user.mobile}));
  notice('Login successful! Redirecting...','success');
  setTimeout(()=>location.href='index.html',600);
}
</script>

<div id="fr-auth-controls" style="position:fixed;right:20px;bottom:20px;z-index:10000;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.96);padding:8px 10px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.14);">
  <span data-fr-user class="small fw-semibold"></span>
  <a data-fr-login href="auth.html" class="btn btn-brand btn-sm">Login</a>
  <a data-fr-register href="auth.html#register" class="btn btn-outline-primary btn-sm">Register</a>
  <button data-fr-logout type="button" onclick="foodrushLogout()" class="btn btn-outline-danger btn-sm" style="display:none;">Logout</button>
</div>

<script>
(function(){
  window.foodrushLogout = function(){
    localStorage.removeItem('fr_user');
    localStorage.removeItem('fr_cart');
    localStorage.removeItem('fr_checkout_user');
    window.location.href='auth.html';
  };
  window.updateFoodRushAuth = function(){
    var user = null;
    try { user = JSON.parse(localStorage.getItem('fr_user') || 'null'); } catch(e) {}
    document.querySelectorAll('[data-fr-login]').forEach(function(el){
      el.style.display = user ? 'none' : '';
    });
    document.querySelectorAll('[data-fr-register]').forEach(function(el){
      el.style.display = user ? 'none' : '';
    });
    document.querySelectorAll('[data-fr-logout]').forEach(function(el){
      el.style.display = user ? '' : 'none';
    });
    document.querySelectorAll('[data-fr-user]').forEach(function(el){
      el.textContent = user ? (user.name || user.email || 'Account') : '';
    });
  };
  document.addEventListener('DOMContentLoaded', window.updateFoodRushAuth);
  if(location.hash === '#register') setTimeout(function(){ if(typeof showForm === 'function') showForm('register'); }, 0);
})();
</script>


<script>

/* FoodRush premium motion engine */
(function(){
  const ready = () => {
    document.body.classList.add('fr-ready');

    const header = document.querySelector('.navbar-wrap');
    if(header){
      const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 16);
      onScroll();
      window.addEventListener('scroll', onScroll, {passive:true});

      const path = location.pathname.split('/').pop() || 'index.html';
      header.querySelectorAll('.nav-link').forEach(link => {
        const href = (link.getAttribute('href') || '').split('?')[0].split('#')[0];
        if(href === path || (path === '' && href === 'index.html')){
          link.classList.add('active');
          link.setAttribute('aria-current','page');
        }
      });
    }

    const targets = document.querySelectorAll(
      'main > section, main .section, main .card, main .category-card, main .restaurant-card, main .food-card, main .glass, main .offer-banner, footer'
    );
    targets.forEach((el, i) => {
      if(el.closest('.modal-shell')) return;
      el.classList.add(i % 3 === 0 ? 'reveal' : 'reveal-scale');
      el.style.transitionDelay = Math.min((i % 6) * 55, 275) + 'ms';
    });

    if('IntersectionObserver' in window){
      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if(entry.isIntersecting){
            entry.target.classList.add('is-visible');
            obs.unobserve(entry.target);
          }
        });
      }, {threshold:.10, rootMargin:'0px 0px -45px'});
      document.querySelectorAll('.reveal,.reveal-scale').forEach(el => observer.observe(el));
    }else{
      document.querySelectorAll('.reveal,.reveal-scale').forEach(el => el.classList.add('is-visible'));
    }

    document.querySelectorAll('.btn-brand,.btn:not(.navbar-toggler)').forEach(btn => {
      if(btn.dataset.rippleBound) return;
      btn.dataset.rippleBound = '1';
      btn.addEventListener('click', function(e){
        if(this.disabled) return;
        const rect = this.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.className = 'fr-ripple';
        const size = Math.max(rect.width, rect.height) * .32;
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 650);
      });
    });

    // Gentle tilt for desktop food/restaurant cards.
    if(window.matchMedia('(pointer:fine)').matches && !window.matchMedia('(prefers-reduced-motion:reduce)').matches){
      document.querySelectorAll('.food-card,.restaurant-card,.category-card').forEach(card => {
        card.addEventListener('mousemove', e => {
          const r = card.getBoundingClientRect();
          const x = (e.clientX-r.left)/r.width-.5;
          const y = (e.clientY-r.top)/r.height-.5;
          card.style.transform = `translateY(-7px) perspective(700px) rotateX(${(-y*2).toFixed(2)}deg) rotateY(${(x*2).toFixed(2)}deg)`;
        });
        card.addEventListener('mouseleave', () => card.style.transform = '');
      });
    }
  };

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready);
  else ready();
})();

</script>
</body>
</html>
